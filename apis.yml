aid: armorcode
name: ArmorCode
description: >-
  ArmorCode is a unified exposure and application security posture management (ASPM)
  platform that consolidates vulnerability and security findings from 350+ security
  tools and scanners into a single control plane. It uses a Context Risk Graph and
  agentic AI workflows (Anya agents) to prioritize risk and automate remediation
  across application, cloud, software supply-chain, and AI security. ArmorCode
  exposes a REST API on app.armorcode.com (US) and eu.armorcode.com (EU) for
  programmatic access to findings, integrations, and remediation workflows, secured
  with bearer API tokens. Originally surfaced as a Sierra Ventures portfolio company
  and enriched here from ArmorCode's public developer and trust surfaces.
